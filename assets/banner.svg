<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Apostolis — cozy night desk, pixel art</title>

  <!-- floor -->
  <rect x="0" y="204" width="900" height="16" fill="#2B211D"/>

  <!-- window -->
  <rect x="650" y="40" width="110" height="80" fill="#2B211D"/>
  <rect x="658" y="48" width="94" height="64" fill="#14110F"/>
  <rect x="700" y="48" width="6" height="64" fill="#2B211D"/>
  <rect x="658" y="76" width="94" height="6" fill="#2B211D"/>
  <g fill="#E8A33D">
    <rect x="672" y="58" width="4" height="4">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="722" y="90" width="4" height="4">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="736" y="58" width="4" height="4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- desk -->
  <rect x="260" y="150" width="380" height="6" fill="#7C5A45"/>
  <rect x="260" y="156" width="380" height="8" fill="#6B4A3A"/>
  <rect x="260" y="164" width="380" height="4" fill="#2B211D"/>
  <rect x="270" y="168" width="14" height="36" fill="#2B211D"/>
  <rect x="616" y="168" width="14" height="36" fill="#2B211D"/>

  <!-- plant -->
  <rect x="270" y="140" width="18" height="14" fill="#6B4A3A"/>
  <rect x="272" y="136" width="14" height="4" fill="#7C5A45"/>
  <g fill="#7FA37A">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 279 140;2 279 140;-2 279 140" dur="6s" repeatCount="indefinite"/>
      <rect x="264" y="120" width="6" height="18"/>
      <rect x="272" y="112" width="6" height="26"/>
      <rect x="282" y="118" width="6" height="20"/>
      <rect x="290" y="124" width="6" height="14"/>
    </g>
  </g>

  <!-- monitor -->
  <rect x="315" y="148" width="50" height="6" fill="#2B211D"/>
  <rect x="330" y="140" width="20" height="10" fill="#2B211D"/>
  <rect x="300" y="90" width="80" height="52" fill="#2B211D"/>
  <rect x="308" y="98" width="64" height="36" fill="#14110F"/>
  <rect x="308" y="98" width="64" height="36" fill="#7FA37A" opacity="0.10"/>
  <rect x="314" y="106" width="26" height="4" fill="#6B4A3A"/>
  <rect x="314" y="114" width="40" height="4" fill="#6B4A3A"/>
  <rect x="314" y="124" width="8" height="6" fill="#7FA37A">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- mug + steam -->
  <rect x="408" y="136" width="24" height="4" fill="#E8A33D"/>
  <rect x="410" y="140" width="20" height="12" fill="#C9683D"/>
  <rect x="430" y="142" width="4" height="8" fill="#C9683D"/>
  <g stroke="#F5E6D3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M416,134 q4,-6 0,-12 q-4,-6 0,-12">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M424,134 q4,-6 0,-12 q-4,-6 0,-12">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M420,134 q-4,-6 0,-12 q4,-6 0,-12">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- lamp -->
  <rect x="470" y="150" width="16" height="6" fill="#2B211D"/>
  <rect x="476" y="100" width="4" height="50" fill="#2B211D"/>
  <polygon points="452,112 506,112 522,150 436,150" fill="#E8A33D" opacity="0.18">
    <animate attributeName="opacity" values="0.12;0.30;0.12" dur="3.2s" repeatCount="indefinite"/>
  </polygon>
  <g transform="translate(478,96) rotate(20)">
    <rect x="-24" y="-8" width="48" height="14" fill="#C9683D"/>
    <rect x="-24" y="4" width="48" height="4" fill="#2B211D"/>
  </g>
  <circle cx="478" cy="106" r="5" fill="#E8A33D">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
